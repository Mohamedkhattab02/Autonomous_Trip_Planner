# Run the planner with `docker compose up`.
#
# Secrets come from the environment, never from a file baked into the image.
# Everything the planner writes lives in a named volume, so a rebuild does not
# throw away the cache, the checkpoints or the traveler profiles.

services:
  planner:
    build: .
    ports:
      - "7860:7860"
    environment:
      # Required.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your shell or .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?set TAVILY_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:?set SERPAPI_API_KEY}

      # Model selection. Any LangChain provider:model string works.
      LLM_MODEL: ${LLM_MODEL:-openai:gpt-5-mini}

      # Behaviour switches.
      TRIP_CACHE_ENABLED: ${TRIP_CACHE_ENABLED:-true}
      TRIP_CHECKPOINTS: ${TRIP_CHECKPOINTS:-true}
      EXPLAIN_ROUTING: ${EXPLAIN_ROUTING:-false}

      # Google Calendar over MCP. The credentials file is mounted read-only
      # below; leave CALENDAR_MCP_ENABLED unset to export .ics instead.
      CALENDAR_MCP_ENABLED: ${CALENDAR_MCP_ENABLED:-false}
      GOOGLE_OAUTH_CREDENTIALS: /run/secrets/gcp-oauth.keys.json
      GOOGLE_CALENDAR_MCP_TOKEN_PATH: /app/.checkpoints/gcal-tokens.json

      # Optional tracing.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-Autonomous Trip Planner}

    volumes:
      - exports:/app/exports
      - cache:/app/.cache
      - checkpoints:/app/.checkpoints
      - profiles:/app/profiles
      # Point CALENDAR_CREDENTIALS at your downloaded OAuth JSON to enable MCP.
      - ${CALENDAR_CREDENTIALS:-./credentials/gcp-oauth.keys.json}:/run/secrets/gcp-oauth.keys.json:ro

    restart: unless-stopped

volumes:
  exports:
  cache:
  checkpoints:
  profiles:
