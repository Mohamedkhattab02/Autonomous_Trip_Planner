[project]
name = "autonomous-trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "deepagents>=0.7.0",
    "geopy>=2.5.0",
    "icalendar>=7.2.2",
    "isort>=8.0.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "markdown>=3.10.2",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "scikit-learn>=1.9.0",
    "serpapi>=1.0.2",
    "tavily-python>=0.7.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_planner"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call the real Gemini and Tavily APIs (network + API keys)",
]
